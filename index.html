            letter-spacing: -0.05em;

        /* 말풍선 기본 스타일 */
        .speech-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            color: #000000;
            border: 3px solid #000000;
            border-radius: 24px;
            padding: 12px 18px;
            font-weight: 700;
            font-size: 14px;

            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4);
            max-width: 240px;
            z-index: 30;
            transition: transform 0.2s ease;
        }

        .speech-bubble:hover {
            transform: scale(1.03);
        }

        /* 말풍선 꼬리표 */
        .speech-bubble::after {
            content: '';
            position: absolute;
            border-style: solid;
            display: block;
            width: 0;
            z-index: 29;
        }

        .bubble-tail-bottom::after {
            bottom: -16px;
            left: 30px;
            border-width: 16px 12px 0 0;
            border-color: #000000 transparent transparent transparent;
        }

        .bubble-tail-top::after {
            top: -16px;
            left: 30px;

        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high text-green-500";
                playSynthTone(600, 0.1);
            } else {
                icon.className = "fa-solid fa-volume-xmark text-gray-500";
            }
        }

        // 간단한 효과음 합성기 생성
        function playSynthTone(freq, duration, type = 'sine') {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play blocked/failed", e);
            }
        }

        // 특수 신스음 (폭발/사자후 등)

            if (!soundEnabled) return;

                playSynthTone(100, 0.8, 'sawtooth');
                setTimeout(() => playSynthTone(60, 0.5, 'triangle'), 100);
            } else if (style === 'clack') {
                playSynthTone(800, 0.05, 'square');
                setTimeout(() => playSynthTone(1000, 0.05, 'square'), 50);
            } else if (style === 'slosh') {
                playSynthTone(200, 0.3, 'sine');
            } else if (style === 'flick') {
                playSynthTone(1200, 0.1, 'sine');
            }

        // 뷰어 렌더링 엔진
        function renderWebtoon() {
            const container = document.getElementById('webtoon-viewer');
            container.innerHTML = '';

            let currentEpisode = '';

            webtoonCuts.forEach((cut) => {
                // 에피소드 구분선 삽입
                if (cut.episode !== currentEpisode) {
                    currentEpisode = cut.episode;
                    const divider = document.createElement('div');
                    divider.id = cut.epId;
                    divider.className = "py-10 text-center flex flex-col items-center justify-center bg-black/60 relative border-y border-gray-950 my-12";
                    divider.innerHTML = `
                        <div class="absolute inset-0 bg-blue-900/5 blur-xl"></div>
                        <span class="text-[10px] text-blue-500 font-bold tracking-[0.25em] uppercase mb-1">EPISODE</span>
                        <h3 class="text-xl font-bold text-white manhwa-title tracking-tight px-6">${currentEpisode}</h3>
                        <div class="h-0.5 w-16 bg-gradient-to-r from-transparent via-blue-800 to-transparent mt-3"></div>
                    `;
                    container.appendChild(divider);
                }

                // 개별 만화 패널 박스 생성
                const panel = document.createElement('div');
                panel.className = "panel-container relative px-4 py-8 flex flex-col items-center group";
                panel.id = `panel-wrap-${cut.id}`;

                // 나레이션 상단 박스
                let narrativeTop = '';
                if (cut.narrative) {
                    narrativeTop = `
                        <div class="narration-box mb-6 px-5 py-4 w-full max-w-[420px] rounded border border-gray-900/50 text-gray-400">
                            ${cut.narrative.replace(/\n/g, '<br>')}
                        </div>
                    `;
                }

                // 말풍선 DOM 제작
                let bubblesHTML = '';
                if (cut.bubbles && cut.bubbles.length > 0) {
                    cut.bubbles.forEach((b) => {
                        const bubbleClass = b.choi ? 'bubble-choi' : '';
                        bubblesHTML += `
                            <div class="speech-bubble ${bubbleClass} ${b.tail} ${b.x}">
                                ${b.dialogue.replace(/\n/g, '<br>')}
                            </div>
                        `;
                    });
                }

                // 효과음 기포
                let effectHTML = '';
                if (cut.soundEffect) {
                    effectHTML = `
                        <div class="effect-sound absolute ${cut.effectPos}">
                            ${cut.soundEffect}
                        </div>
                    `;
                }

                panel.innerHTML = `
                    ${narrativeTop}
                    
                    <!-- 실제 작화 영역 -->
                    <div class="relative w-full aspect-[3/4] max-w-[420px] bg-gradient-to-b ${cut.placeholderGradient} rounded-2xl overflow-hidden border border-gray-900 shadow-[0_15px_40px_rgba(0,0,0,0.8)] transition duration-500 group-hover:border-blue-900/30">
                        <!-- AI로 그려질 이미지 태그 -->
                       <img id="img-panel-${cut.id}" class="w-full h-full object-cover opacity-100 transition duration-1000" src="images/${cut.id}.png" alt="${cut.title}">
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/90 pointer-events-none"></div>

                        <!-- 컷 효과음 및 말풍선 레이어 -->
                        ${effectHTML}
                        ${bubblesHTML}

                        <!-- 로딩 스피너 -->
                        <div id="loader-panel-${cut.id}" class="absolute inset-0 flex flex-col items-center justify-center bg-black/85 hidden z-20">
                            <i class="fa-solid fa-wand-magic-sparkles animate-spin text-3xl text-red-500 mb-3"></i>
                            <span class="text-xs text-red-400 font-bold tracking-wider">AI가 고화질 웹툰을 드로잉 중...</span>
                        </div>

                        <!-- 개별 재생성 오버레이 버튼 -->
                        <div class="absolute bottom-4 right-4 z-30 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="regeneratePanel(${cut.id})" class="bg-black/80 hover:bg-red-950 border border-red-900 text-white text-[10px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-arrows-rotate animate-spin-hover"></i> 이 컷만 AI 작화
                            </button>
                        </div>
                    </div>

                    <!-- 컷 미세 설명자 -->
                    <div class="w-full max-w-[420px] mt-3 flex justify-between items-center text-[10px] text-gray-600 px-1">
                        <span>Cut #${cut.id} : ${cut.title}</span>
                        <span class="hover:text-blue-500 cursor-pointer" onclick="regeneratePanel(${cut.id})">AI 드로잉 트리거</span>
                    </div>
                `;

                container.appendChild(panel);

                // 컷간 마감 그라데이션 여백 추가
                const gap = document.createElement('div');
                gap.className = "cut-gap";
                container.appendChild(gap);
            });
        }

        // 특정 에피소드로 즉시 스크롤 스킵
        function scrollToEpisode(epId) {
            const target = document.getElementById(epId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                playSynthTone(500, 0.1);
            }
        }

        // 개별 패널 이미지 생성 요청 (지수 백오프 지원)
        async function generatePanelImage(panelId) {
            const imgElement = document.getElementById(`img-panel-${panelId}`);
            const loader = document.getElementById(`loader-panel-${panelId}`);
            
            if (loader) loader.classList.remove('hidden');

            const cut = webtoonCuts.find(c => c.id === panelId);
            if (!cut) return false;

            const apiKey = ""; // Canvas 런타임에 자동 매핑됩니다.
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;

            const payload = {
                instances: [{ prompt: cut.prompt }],
                parameters: {
                    sampleCount: 1
                }
            };

            let delay = 1000;
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const result = await response.json();
                    const base64Encoded = result?.predictions?.[0]?.bytesBase64Encoded;

                    if (base64Encoded) {
                        imgElement.src = `data:image/png;base64,${base64Encoded}`;
                        imgElement.classList.remove('opacity-30', 'blur-[2px]');
                        imgElement.classList.add('opacity-100');
                        
                        // 사운드 이펙트
                        playDramaSound(cut.soundStyle || 'clack');
                        
                        if (loader) loader.classList.add('hidden');
                        return true;
                    }
                } catch (err) {
                    console.debug(`[Cut ${panelId} Attempt ${attempt+1}]`, err);
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }

            if (loader) loader.classList.add('hidden');
            return false;
        }

        // 특정 패널 단독 재생성
        async function regeneratePanel(panelId) {
            await generatePanelImage(panelId);
        }

        // 전체 37개 패널 자동 연속 드로잉 시스템
        async function startGlobalGeneration() {
            const globalBtn = document.getElementById('global-gen-btn');
            const progressBoard = document.getElementById('progress-board');
            
            globalBtn.disabled = true;
            globalBtn.classList.add('opacity-50');
            progressBoard.classList.remove('hidden');

            const total = webtoonCuts.length;
            let success = 0;

            for (let i = 0; i < total; i++) {
                const cut = webtoonCuts[i];
                const percent = Math.round((i / total) * 100);
                
                // 진행 정보 업데이트
                document.getElementById('progress-text').innerText = `[${i+1}/${total}] '${cut.title}' 드로잉 중...`;
                document.getElementById('progress-percent').innerText = `${percent}%`;
                document.getElementById('progress-bar').style.width = `${percent}%`;
                
                // 뷰포트 이동
                const el = document.getElementById(`panel-wrap-${cut.id}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });

                const isSuccess = await generatePanelImage(cut.id);
                if (isSuccess) success++;

                await new Promise(resolve => setTimeout(resolve, 800));
            }

            // 완료 마감
            document.getElementById('progress-text').innerText = `지존 작화 완성! (성공: ${success}/${total})`;
            document.getElementById('progress-percent').innerText = `100%`;
            document.getElementById('progress-bar').style.width = `100%`;
            playSynthTone(800, 0.4);

            setTimeout(() => {
                progressBoard.classList.add('hidden');
                globalBtn.disabled = false;
                globalBtn.classList.remove('opacity-50');
            }, 5000);
        }

        // 초기 시작
        window.addEventListener('DOMContentLoaded', () => {
            renderWebtoon();
        });
    </script>
</body>
</html>
